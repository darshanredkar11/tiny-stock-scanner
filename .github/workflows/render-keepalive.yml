name: Render keep-alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping app health endpoint
        run: |
          curl --fail --silent --show-error --max-time 25 https://tiny-stock-scanner.onrender.com/health
          echo
          echo "Keep-alive request completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
